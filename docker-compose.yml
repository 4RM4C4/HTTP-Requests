services:
  app:
    build:
      context: .
      args:
        # Relative paths work from any IP — no need to hardcode the Pi's address
        VITE_HTTPREQUEST: ${VITE_HTTPREQUEST:-/api/requests}
        VITE_HTTPREQUESTLOGIN: ${VITE_HTTPREQUESTLOGIN:-/api/login}
    ports:
      - "${HOST_PORT:-3001}:3001"
    environment:
      # Force container to always use 3001 (overrides PORT in backend/.env)
      PORT: 3001
      NODE_ENV: production
    env_file:
      - backend/.env
    restart: unless-stopped
    # MariaDB is external — no DB service needed here
