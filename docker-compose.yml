services:
  app:
    build:
      context: .
      args:
        # Pass build-time frontend variables
        VITE_HTTPREQUEST: ${VITE_HTTPREQUEST:-http://localhost:3001/api/requests}
        VITE_HTTPREQUESTLOGIN: ${VITE_HTTPREQUESTLOGIN:-http://localhost:3001/api/login}
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - backend/.env
    restart: unless-stopped
    # MariaDB is external (192.168.0.254) — no DB service needed here
